services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./data:/code/data
      - ./kb:/code/kb
      - ./tests:/code/tests
    depends_on:
      - chroma

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8080
    volumes:
      - ./frontend:/app
    depends_on:
      - api

  chroma:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data

volumes:
  chroma_data:
