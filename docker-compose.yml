services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./data:/code/data
      - ./kb:/code/kb
    depends_on:
      - chroma

  chroma:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data

volumes:
  chroma_data:
